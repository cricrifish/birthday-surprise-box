<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>一份只屬於你的生日驚喜 ♡</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("clawpilotTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>

    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 28px 20px; background: var(--cp-bg); color: var(--cp-text); font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif; line-height: 1.6; }
    main { width: min(100%, 460px); }
    .card { position: relative; border: 1px solid var(--cp-border); border-radius: 16px; background: var(--cp-bg-elevated); padding: 40px 32px 32px; }
    .card::before { content: ""; position: absolute; inset: 8px; border: 1px dashed var(--cp-border); border-radius: 10px; pointer-events: none; }
    .key-mark { position: relative; margin-bottom: 24px; width: 52px; height: 52px; display: grid; place-items: center; border-radius: 10px; background: var(--cp-accent-soft); color: var(--cp-accent); }
    .key-mark svg { width: 28px; height: 28px; fill: none; stroke: var(--cp-accent); stroke-width: 1.8; stroke-linecap: round; }
    .eyebrow { font-size: 9px; color: var(--cp-accent); letter-spacing: 2px; font-weight: 750; }
    h1 { font-size: 32px; font-weight: 850; line-height: 1.45; letter-spacing: -.5px; margin: 12px 0; }
    h1 span { color: var(--cp-accent); }
    .intro { font-size: 13px; color: var(--cp-text-muted); margin: 0 0 28px; line-height: 1.9; }
    form { position: relative; }
    label { display: block; font-size: 12px; font-weight: 650; margin-bottom: 8px; }
    .input-row { display: flex; border: 1px solid var(--cp-border-strong); border-radius: 10px; background: var(--cp-surface); overflow: hidden; }
    .input-row:focus-within { outline: 2px solid var(--cp-accent); outline-offset: 3px; }
    input { min-width: 0; width: 100%; padding: 13px 12px; border: 0; outline: 0; background: var(--cp-surface); color: var(--cp-text); font: 16px Consolas, "Courier New", Courier, monospace; }
    button { font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid var(--cp-accent); outline-offset: 4px; }
    #show-password { border: 0; background: var(--cp-surface); color: var(--cp-text-muted); font-size: 11px; padding: 0 12px; white-space: nowrap; }
    #unlock-button { width: 100%; border: 1px solid var(--cp-accent); border-radius: 10px; background: var(--cp-accent); color: var(--cp-accent-fg); padding: 13px 12px; font-weight: 650; }
    #unlock-button:hover { background: var(--cp-accent-hover); }
    #unlock-button:disabled { opacity: .6; cursor: wait; }
    #error { min-height: 40px; margin: 8px 0; color: var(--cp-danger); font-size: 12px; line-height: 1.7; }
    .privacy { margin: 22px 0 0; padding-top: 20px; border-top: 1px dashed var(--cp-border); color: var(--cp-text-soft); font-size: 10px; text-align: center; }
    footer { padding-top: 20px; text-align: center; color: var(--cp-text-soft); font-size: 9px; letter-spacing: 1px; }
    footer span { color: var(--cp-accent); }
    noscript { color: var(--cp-danger); font-size: 13px; }
    @media (max-width: 380px) { .card { padding: 32px 24px 24px; } h1 { font-size: 28px; } }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <div class="key-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="7" y="13" width="18" height="15" rx="4"/><path d="M11 13V9a5 5 0 0 1 10 0v4M16 19v4"/></svg></div>

        <div class="input-row">
          <input id="password" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="error" required>
          <button type="button" id="show-password" aria-label="顯示密碼" aria-pressed="false">顯示</button>

        <p id="error" role="alert"></p>

  <script>
    (() => {
      "use strict";
      const theme = new URLSearchParams(location.search).get("clawpilotTheme");
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      const form = document.getElementById("unlock-form");
      const password = document.getElementById("password");
      const button = document.getElementById("unlock-button");
      const message = document.getElementById("error");
      const toggle = document.getElementById("show-password");
      let busy = false;
      toggle.addEventListener("click", () => {
        const show = password.type === "password";
        password.type = show ? "text" : "password";
        toggle.textContent = show ? "隱藏" : "顯示";
        toggle.setAttribute("aria-label", show ? "隱藏密碼" : "顯示密碼");
        toggle.setAttribute("aria-pressed", String(show));
      });
      form.addEventListener("submit", async event => {
        event.preventDefault();
        if (busy) return;
        message.textContent = "";
        password.removeAttribute("aria-invalid");
        if (!password.value.trim()) {
          message.textContent = "先輸入收到的專屬密碼，就能打開驚喜囉。";
          password.setAttribute("aria-invalid", "true");
          password.focus();
          return;
        }
        if (!globalThis.crypto?.subtle) {
          message.textContent = "此瀏覽器無法安全解鎖。請用最新版 Safari、Chrome 或 Edge，並透過 HTTPS 網址開啟。";
          return;
        }
        busy = true;
        button.disabled = true;
        toggle.disabled = true;
        button.textContent = "正在打開你的生日驚喜…";
        try {
          const payload = JSON.parse(document.getElementById("encrypted-payload").textContent);
          if (payload.version !== 1 || payload.algorithm !== "AES-256-GCM" || payload.iterations !== 600000) throw new Error("Unsupported encrypted gift format");
          const decode = value => {
            if (typeof value !== "string") throw new Error("Invalid encrypted gift data");
            return Uint8Array.from(atob(value), character => character.charCodeAt(0));
          };
          const salt = decode(payload.salt);
          const iv = decode(payload.iv);
          const data = decode(payload.data);
          if (salt.length !== 32 || iv.length !== 12 || data.length < 16 || data.length > 8 * 1024 * 1024) throw new Error("Invalid encrypted gift size");
          const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(password.value.trim()), "PBKDF2", false, ["deriveKey"]);
          const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: payload.iterations, hash: "SHA-256" }, material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
          const plaintext = await crypto.subtle.decrypt({ name: "AES-GCM", iv, tagLength: 128 }, key, data);
          const html = new TextDecoder("utf-8", { fatal: true }).decode(plaintext);
          if (!html.startsWith("<!doctype html>")) throw new Error("Invalid decrypted gift document");
          password.value = "";
          document.open();
          document.write(html);
          document.close();
        } catch (error) {
          console.error("Unable to unlock encrypted gift", error);
          message.textContent = error.name === "OperationError"
            ? "密碼不正確，或分享檔案已損壞。請確認密碼後再試一次。"
            : "無法解鎖這份分享檔案，請重新載入，或聯絡準備禮物的人。";
          password.setAttribute("aria-invalid", "true");
          password.focus();
          password.select();
        } finally {
          busy = false;
          button.disabled = false;
          toggle.disabled = false;
          button.textContent = "打開生日驚喜 ↗";
        }
      });
    })();
  </script>
